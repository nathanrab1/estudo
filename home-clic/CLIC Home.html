  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

n<\u002Fstyle>\n<style>\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  body { background: #EFEFEF; color: #2B2B2B; font-family: 'Nunito Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\n  a { color: #C64F28; text-decoration: none; }\n  a:hover { color: #9B3C1E; }\n  p { margin: 0; }\n  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }\n  @keyframes floaty2 { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(12px) rotate(-4deg); } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"width:100%; background:#EFEFEF; overflow:hidden;\">\n\n  <!-- ===== HEADER ===== -->\n  <header style=\"position:sticky; top:0; z-index:50; background:rgba(239,239,239,0.88); backdrop-filter:blur(8px); border-bottom:1px solid rgba(43,43,43,0.08);\">\n    \n  <\u002Fheader>\n\n  <!-- ===== HERO ===== -->\n  <section id=\"topo\" style=\"position:relative; max-width:1160px; margin:0 auto; padding:96px 40px 88px;\">\n    <sc-if value=\"{{ showBlobs }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position:absolute; inset:0; pointer-events:none; z-index:0;\">\n        <svg sc-camel-view-box=\"0 0 172 148.5\" width=\"240\" style=\"position:absolute; left:38%; top:24px; opacity:0.5; animation:floaty 9s ease-in-out infinite;\"><path d=\"M 172 84.488 C 172 128.118 132.083 148.5 93 148.5 C 53.917 148.5 0 128.118 0 84.488 C 0 40.857 35.917 0 75 0 C 95.198 0 140.106 12.348 153 27.5 C 165.055 41.666 172 63.406 172 84.488 Z\" fill=\"#D89384\"><\u002Fpath><\u002Fsvg>\n        <svg sc-camel-view-box=\"0 0 172 163\" width=\"300\" style=\"position:absolute; right:-40px; top:130px; opacity:0.55; animation:floaty2 11s ease-in-out infinite;\"><path d=\"M 172 87.488 C 172 131.119 121.083 163 82 163 C 42.917 163 0 131.119 0 87.488 C 0 43.858 42.917 0 82 0 C 102.198 0 142.606 6.848 155.5 22 C 167.555 36.166 172 66.406 172 87.488 Z\" fill=\"#EFE1BD\"><\u002Fpath><\u002Fsvg>\n        <svg sc-camel-view-box=\"0 0 160.5 158.48\" width=\"210\" style=\"position:absolute; right:120px; bottom:-40px; opacity:0.5; animation:floaty 12s ease-in-out infinite;\"><path d=\"M 160.5 87.988 C 160.5 108.723 137.569 136.537 124 148.5 C 109.017 161.71 102.381 158 81.871 158 C 42.789 158 0 141.13 0 97.5 C 0 53.87 42.789 0 81.871 0 C 102.07 0 134.338 1.405 147.231 16.557 C 159.286 30.723 160.5 66.906 160.5 87.988 Z\" fill=\"#B9D0DB\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"position:relative; z-index:1; max-width:820px;\">\n      \n      <h1 style=\"font-family:'Baloo 2',sans-serif; font-weight:800; font-size:68px; line-height:1.04; letter-spacing:-0.01em; margin:0 0 26px; color:#2B2B2B; text-wrap:balance;\">Transforme o currículo a partir da computação<\u002Fh1>\n      <p style=\"font-size:21px; line-height:1.55; max-width:640px; color:#3a3a3b; margin-bottom:38px; text-wrap:pretty;\">O CLIC leva a computação para dentro da escola de forma integrada ao currículo, onde os alunos aprendem criando e transformando ideias em projetos reais.<\u002Fp>\n      <div style=\"display:flex; align-items:center; gap:16px; flex-wrap:wrap;\">\n        <a href=\"#pilares\" style=\"display:inline-flex; align-items:center; gap:10px; padding:16px 32px; border-radius:44px; background:#C64F28; color:#fff; font-weight:700; font-size:18px;\">Conheça a proposta<\u002Fa>\n        <sc-if value=\"{{ heroSecondaryCta }}\" hint-placeholder-val=\"{{ true }}\">\n          <a href=\"#apps\" style=\"display:inline-flex; align-items:center; gap:10px; padding:15px 30px; border-radius:44px; background:#fff; border:3px solid #2B2B2B; color:#2B2B2B; font-weight:700; font-size:18px;\">Ver unidades<\u002Fa><a href=\"#apps\" style=\"display:inline-flex; align-items:center; gap:10px; padding:15px 30px; border-radius:44px; background:#fff; border:3px solid #2B2B2B; color:#2B2B2B; font-weight:700; font-size:18px;\">Ver aplicativos<\u002Fa>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== SOBRE / FRASE-EIXO ===== -->\n  <section id=\"sobre\" style=\"max-width:1160px; margin:0 auto; padding:40px 40px 56px;\">\n    <div style=\"background:#fff; border-radius:32px; padding:56px 60px; box-shadow:0 20px 50px -30px rgba(43,43,43,0.45); display:flex; gap:40px; align-items:center; flex-wrap:wrap;\">\n      <p style=\"flex:1; min-width:340px; font-family:'Baloo 2',sans-serif; font-weight:600; font-size:30px; line-height:1.28; color:#2B2B2B; margin:0; text-wrap:pretty;\">Sem abrir espaço na grade, o CLIC integra a computação às disciplinas que já existem, conectando o pensamento computacional às demais áreas do conhecimento.<\u002Fp>\n      <div style=\"display:flex; gap:14px; flex-wrap:wrap;\">\n        <span style=\"padding:10px 20px; border-radius:40px; background:#D89384; color:#2B2B2B; font-weight:700; font-size:15px;\">Alinhado à BNCC<\u002Fspan>\n        <span style=\"padding:10px 20px; border-radius:40px; background:#EFE1BD; color:#2B2B2B; font-weight:700; font-size:15px;\">Rigor acadêmico<\u002Fspan>\n        <span style=\"padding:10px 20px; border-radius:40px; background:#B9D0DB; color:#2B2B2B; font-weight:700; font-size:15px;\">Feito com professores<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== PILARES ===== -->\n  <section id=\"pilares\" style=\"max-width:1160px; margin:0 auto; padding:72px 40px 40px;\">\n    <div style=\"max-width:640px; margin-bottom:56px;\">\n      <span style=\"font-weight:700; font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#C64F28;\">Como atuamos<\u002Fspan>\n      <h2 style=\"font-family:'Baloo 2',sans-serif; font-weight:700; font-size:44px; line-height:1.1; margin:12px 0 0; color:#2B2B2B;\">Três frentes que se sustentam<\u002Fh2>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-direction:column; gap:36px;\">\n      <!-- Pilar 1 -->\n      <div style=\"background:#fff; border-radius:28px; padding:40px 44px; display:flex; gap:40px; align-items:flex-start; box-shadow:0 16px 44px -32px rgba(43,43,43,0.5);\">\n        <div style=\"flex:none; position:relative; width:168px; height:168px; display:flex; align-items:center; justify-content:center;\">\n          <svg sc-camel-view-box=\"0 0 172 148.5\" width=\"168\" style=\"position:absolute; inset:0; margin:auto;\"><path d=\"M 172 84.488 C 172 128.118 132.083 148.5 93 148.5 C 53.917 148.5 0 128.118 0 84.488 C 0 40.857 35.917 0 75 0 C 95.198 0 140.106 12.348 153 27.5 C 165.055 41.666 172 63.406 172 84.488 Z\" fill=\"#D89384\"><\u002Fpath><\u002Fsvg>\n          <div style=\"position:relative; width:88px; height:102px;\">\n            <img src=\"371b60be-a52f-4a50-9654-5a6f8b6f2c6c\" style=\"position:absolute; left:3.5px; top:3.7px; width:80px;\">\n            <img src=\"bda302f6-b357-48ce-aa85-f367ec4a19eb\" style=\"position:absolute; left:0; top:0; width:88px;\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;\">\n          <h3 style=\"font-family:'Baloo 2',sans-serif; font-weight:700; font-size:27px; margin:6px 0 12px; color:#2B2B2B;\">Aprendizagem interdisciplinar<\u002Fh3>\n          <p style=\"font-size:18px; line-height:1.6; color:#3a3a3b; max-width:640px; text-wrap:pretty;\">O CLIC integra a computação aos componentes curriculares existentes, conectando o pensamento computacional às demais áreas do conhecimento. Em vez de tratar a programação como disciplina isolada, mostramos como ela pode enriquecer o que já se aprende em sala e tornar as aulas mais dinâmicas e envolventes.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- Pilar 2 -->\n      <div style=\"background:#fff; border-radius:28px; padding:40px 44px; display:flex; gap:40px; align-items:flex-start; box-shadow:0 16px 44px -32px rgba(43,43,43,0.5);\">\n        <div style=\"flex:none; position:relative; width:168px; height:168px; display:flex; align-items:center; justify-content:center;\">\n          <svg sc-camel-view-box=\"0 0 172 163\" width=\"168\" style=\"position:absolute; inset:0; margin:auto;\"><path d=\"M 172 87.488 C 172 131.119 121.083 163 82 163 C 42.917 163 0 131.119 0 87.488 C 0 43.858 42.917 0 82 0 C 102.198 0 142.606 6.848 155.5 22 C 167.555 36.166 172 66.406 172 87.488 Z\" fill=\"#EFE1BD\"><\u002Fpath><\u002Fsvg>\n          <img src=\"f5f2b8a7-4a1f-4bf5-8d79-d57ed36cf94b\" style=\"position:relative; width:92px;\">\n        <\u002Fdiv>\n        <div style=\"flex:1;\">\n          <h3 style=\"font-family:'Baloo 2',sans-serif; font-weight:700; font-size:27px; margin:6px 0 12px; color:#2B2B2B;\">Desenvolvimento de aplicativos sob medida<\u002Fh3>\n          <p style=\"font-size:18px; line-height:1.6; color:#3a3a3b; max-width:640px; text-wrap:pretty;\">Criamos aplicativos educacionais pensados para a realidade das escolas e o currículo brasileiro. Cada ferramenta nasce de uma necessidade pedagógica concreta, colocando a tecnologia a serviço da aprendizagem.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- Pilar 3 -->\n      <div style=\"background:#fff; border-radius:28px; padding:40px 44px; display:flex; gap:40px; align-items:flex-start; box-shadow:0 16px 44px -32px rgba(43,43,43,0.5);\">\n        <div style=\"flex:none; position:relative; width:168px; height:168px; display:flex; align-items:center; justify-content:center;\">\n          <svg sc-camel-view-box=\"0 0 160.5 158.48\" width=\"168\" style=\"position:absolute; inset:0; margin:auto;\"><path d=\"M 160.5 87.988 C 160.5 108.723 137.569 136.537 124 148.5 C 109.017 161.71 102.381 158 81.871 158 C 42.789 158 0 141.13 0 97.5 C 0 53.87 42.789 0 81.871 0 C 102.07 0 134.338 1.405 147.231 16.557 C 159.286 30.723 160.5 66.906 160.5 87.988 Z\" fill=\"#B9D0DB\"><\u002Fpath><\u002Fsvg>\n          <div style=\"position:relative; width:93px; height:96px;\">\n            <img src=\"817e969e-c694-417f-97d8-3c73d63732fd\" style=\"position:absolute; left:3.8px; top:3.8px; width:85px;\">\n            <img src=\"026eec3e-cc4f-4044-8086-fa1cfaee063e\" style=\"position:absolute; left:0; top:0; width:93px;\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;\">\n          <h3 style=\"font-family:'Baloo 2',sans-serif; font-weight:700; font-size:27px; margin:6px 0 12px; color:#2B2B2B;\">Formação de professores<\u002Fh3>\n          <p style=\"font-size:18px; line-height:1.6; color:#3a3a3b; max-width:640px; text-wrap:pretty;\">Desenhamos trilhas de formação onde os educadores primeiro vivenciam as sequências didáticas como alunos, para depois refletir sobre as práticas pedagógicas. A transformação da sala de aula começa pela experiência de quem ensina.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== POR QUE COMPUTAÇÃO ===== -->\n  <section id=\"porque\" style=\"max-width:1160px; margin:0 auto; padding:88px 40px 40px;\">\n    <div style=\"max-width:680px; margin-bottom:52px;\">\n      <span style=\"font-weight:700; font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#C64F28;\">Por quê<\u002Fspan>\n      <h2 style=\"font-family:'Baloo 2',sans-serif; font-weight:700; font-size:44px; line-height:1.1; margin:12px 0 0; color:#2B2B2B;\">Computação na educação básica<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:28px;\">\n      <div style=\"border-radius: 26px; padding: 36px 34px; box-shadow: 0 16px 44px -34px rgba(43,43,43,0.5); background-color: #D89384\">\n        \n        <h3 style=\"font-family:'Baloo 2',sans-serif; font-weight:700; font-size:23px; margin:0 0 12px; color:#2B2B2B;\">Democratiza um saber restrito<\u002Fh3>\n        <p style=\"font-size:17px; line-height:1.58; color:#3a3a3b; text-wrap:pretty;\">Leva aos estudantes um conhecimento hoje concentrado em poucos, ampliando repertório e oportunidades para além da sala de aula.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-radius: 26px; padding: 36px 34px; box-shadow: 0 16px 44px -34px rgba(43,43,43,0.5); background-color: #EABF48\">\n        \n        <h3 style=\"font-family:'Baloo 2',sans-serif; font-weight:700; font-size:23px; margin:0 0 12px; color:#2B2B2B;\">Alinhada à BNCC<\u002Fh3>\n        <p style=\"font-size:17px; line-height:1.58; color:#3a3a3b; text-wrap:pretty;\">As sequências dialogam com as habilidades previstas na Base, articulando computação e componentes curriculares de forma orgânica.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-radius: 26px; padding: 36px 34px; box-shadow: 0 16px 44px -34px rgba(43,43,43,0.5); background-color: #BACFDB\">\n        \n        <h3 style=\"font-family:'Baloo 2',sans-serif; font-weight:700; font-size:23px; margin:0 0 12px; color:#2B2B2B;\">Desenvolve formas de pensar<\u002Fh3>\n        <p style=\"font-size:17px; line-height:1.58; color:#3a3a3b; margin-bottom:16px; text-wrap:pretty;\">Estrutura o raciocínio para lidar com problemas complexos:<\u002Fp>\n        <div style=\"display:flex; flex-direction:column; gap:8px;\">\n          <span style=\"font-weight:700; font-size:16px; color:#2B2B2B;\">→ Decompor problemas<\u002Fspan>\n          <span style=\"font-weight:700; font-size:16px; color:#2B2B2B;\">→ Identificar padrões<\u002Fspan>\n          <span style=\"font-weight:700; font-size:16px; color:#2B2B2B;\">→ Abstrair o essencial<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== APRENDER CONSTRUINDO (band) ===== -->\n  <section style=\"position:relative; margin-top:88px; background:#E7DCCB; overflow:hidden;\">\n    <sc-if value=\"{{ showBlobs }}\" hint-placeholder-val=\"{{ true }}\">\n      <svg sc-camel-view-box=\"0 0 172 148.5\" width=\"260\" style=\"position: absolute; left: -90px; opacity: 0.55; top: 243px\"><path d=\"M 172 84.488 C 172 128.118 132.083 148.5 93 148.5 C 53.917 148.5 0 128.118 0 84.488 C 0 40.857 35.917 0 75 0 C 95.198 0 140.106 12.348 153 27.5 C 165.055 41.666 172 63.406 172 84.488 Z\" fill=\"#D89384\"><\u002Fpath><\u002Fsvg>\n      <svg sc-camel-view-box=\"0 0 160.5 158.48\" width=\"220\" style=\"position:absolute; right:-30px; top:-30px; opacity:0.5;\"><path d=\"M 160.5 87.988 C 160.5 108.723 137.569 136.537 124 148.5 C 109.017 161.71 102.381 158 81.871 158 C 42.789 158 0 141.13 0 97.5 C 0 53.87 42.789 0 81.871 0 C 102.07 0 134.338 1.405 147.231 16.557 C 159.286 30.723 160.5 66.906 160.5 87.988 Z\" fill=\"#6EA4B7\"><\u002Fpath><\u002Fsvg>\n    <\u002Fsc-if>\n    <div style=\"position:relative; z-index:1; max-width:900px; margin:0 auto; padding:96px 40px; text-align:center;\">\n      <span style=\"font-weight:700; font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#C64F28;\">Nossa filosofia<\u002Fspan>\n      <h2 style=\"font-family:'Baloo 2',sans-serif; font-weight:800; font-size:52px; line-height:1.08; margin:14px 0 24px; color:#2B2B2B; text-wrap:balance;\">Aprender construindo<\u002Fh2>\n      <p style=\"font-size:22px; line-height:1.55; color:#3a3a3b; max-width:760px; margin:0 auto; text-wrap:pretty;\">Os alunos controem artefatos que executam, respondem e e respondem de forma visível. Cada nova etapa da construção serve de alicerce para a evolução do projeto.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== O QUE NOS DIFERENCIA ===== -->\n  <section style=\"max-width:1160px; margin:0 auto; padding:88px 40px 40px;\">\n    <div style=\"max-width:680px; margin-bottom:52px;\">\n      <span style=\"font-weight:700; font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#C64F28;\">O que nos diferencia<\u002Fspan>\n      <h2 style=\"font-family:'Baloo 2',sans-serif; font-weight:700; font-size:44px; line-height:1.1; margin:12px 0 0; color:#2B2B2B;\">Uma abordagem própria<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:28px;\">\n      <div style=\"background:#fff; border-radius:26px; padding:38px 34px; box-shadow:0 16px 44px -34px rgba(43,43,43,0.5);\">\n        <span style=\"font-family:'Baloo 2',sans-serif; font-weight:800; font-size:40px; color:#C64F28;\">01<\u002Fspan>\n        <h3 style=\"font-family:'Baloo 2',sans-serif; font-weight:700; font-size:22px; margin:14px 0 12px; color:#2B2B2B;\">Integração à BNCC<\u002Fh3>\n        <p style=\"font-size:17px; line-height:1.58; color:#3a3a3b; text-wrap:pretty;\">A computação entra pelo que o professor já ensina, fortalecendo as aulas existentes em vez de disputar espaço na grade.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border-radius:26px; padding:38px 34px; box-shadow:0 16px 44px -34px rgba(43,43,43,0.5);\">\n        <span style=\"font-family:'Baloo 2',sans-serif; font-weight:800; font-size:40px; color:#C64F28;\">02<\u002Fspan>\n        <h3 style=\"font-family:'Baloo 2',sans-serif; font-weight:700; font-size:22px; margin:14px 0 12px; color:#2B2B2B;\">Rigor acadêmico<\u002Fh3>\n        <p style=\"font-size:17px; line-height:1.58; color:#3a3a3b; text-wrap:pretty;\">Origem na pesquisa, com fundamentação teórica sólida por trás de cada sequência didática e cada decisão pedagógica.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border-radius:26px; padding:38px 34px; box-shadow:0 16px 44px -34px rgba(43,43,43,0.5);\">\n        <span style=\"font-family:'Baloo 2',sans-serif; font-weight:800; font-size:40px; color:#C64F28;\">03<\u002Fspan>\n        <h3 style=\"font-family:'Baloo 2',sans-serif; font-weight:700; font-size:22px; margin:14px 0 12px; color:#2B2B2B;\">Construção coletiva<\u002Fh3>\n        <p style=\"font-size:17px; line-height:1.58; color:#3a3a3b; text-wrap:pretty;\">Tudo é desenhado junto com professores, ancorado na realidade concreta das escolas brasileiras.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== NOSSOS APLICATIVOS ===== -->\n  <sc-if value=\"{{ showApps }}\" hint-placeholder-val=\"{{ true }}\">\n  <section id=\"apps\" style=\"max-width:1160px; margin:0 auto; padding:88px 40px 40px;\">\n    <div style=\"max-width:680px; margin-bottom:52px;\">\n      <span style=\"font-weight:700; font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#C64F28;\">Ferramentas<\u002Fspan>\n      <h2 style=\"font-family:'Baloo 2',sans-serif; font-weight:700; font-size:44px; line-height:1.1; margin:12px 0 12px; color:#2B2B2B;\">Nossos aplicativos<\u002Fh2>\n      <p style=\"font-size:18px; line-height:1.55; color:#3a3a3b;\">Aplicativos educacionais feitos sob medida para a sala de aula.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:28px;\">\n      <a href=\"#\" style=\"background:#fff; border-radius:28px; padding:38px 36px; box-shadow:0 16px 44px -34px rgba(43,43,43,0.5); display:block;\" style-hover=\"box-shadow:0 24px 50px -30px rgba(43,43,43,0.6);\">\n        <div style=\"height:112px; display:flex; align-items:center; margin-bottom:22px;\">\n          <img src=\"bf115015-fbeb-4466-ac71-1b2a18125092\" alt=\"Caramelo\" style=\"height:44px; display:block;\">\n        <\u002Fdiv>\n        <div style=\"font-size:16px; line-height:1.55; color:#3a3a3b; margin-bottom:18px;\"><div>Descubra como a lógica de programação funciona na prática ao mover o Caramelo pelo grid, transformando sequências de blocos em desenhos.<\u002Fdiv><div><br><\u002Fdiv><\u002Fdiv>\n        <span style=\"font-weight:700; font-size:15px; color:#C64F28;\">Conhecer →<\u002Fspan>\n      <\u002Fa>\n      <a href=\"#\" style=\"background:#fff; border-radius:28px; padding:38px 36px; box-shadow:0 16px 44px -34px rgba(43,43,43,0.5); display:block;\" style-hover=\"box-shadow:0 24px 50px -30px rgba(43,43,43,0.6);\">\n        <div style=\"height:112px; display:flex; align-items:center; margin-bottom:22px;\">\n          <img src=\"c8364c9b-903a-4748-9f33-54ded33fe492\" alt=\"Novelo\" style=\"height:60px; display:block;\">\n        <\u002Fdiv>\n        <div style=\"font-size:16px; line-height:1.55; color:#3a3a3b; margin-bottom:18px;\"><div>Descubra como a lógica de programação funciona na prática ao criar chatbots interativos que tomam decisões e constroem diálogos personalizados.<\u002Fdiv><div><br><\u002Fdiv><\u002Fdiv>\n        <span style=\"font-weight:700; font-size:15px; color:#C64F28;\">Conhecer →<\u002Fspan>\n      <\u002Fa>\n      <a href=\"#\" style=\"background:#fff; border-radius:28px; padding:38px 36px; box-shadow:0 16px 44px -34px rgba(43,43,43,0.5); display:block;\" style-hover=\"box-shadow:0 24px 50px -30px rgba(43,43,43,0.6);\">\n        <div style=\"height:112px; display:flex; align-items:center; margin-bottom:22px;\">\n          <img src=\"3d5491bc-be47-49cd-8550-20f4e59c5729\" alt=\"Grafite\" style=\"height:52px; display:block;\">\n        <\u002Fdiv>\n        <p style=\"font-size:16px; line-height:1.55; color:#3a3a3b; margin-bottom:18px;\">Aplicativo educacional do ecossistema CLIC para apoiar o trabalho em sala.<\u002Fp>\n        <span style=\"font-weight:700; font-size:15px; color:#C64F28;\">Conhecer →<\u002Fspan>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ===== CTA FINAL ===== -->\n  <section id=\"contato\" style=\"max-width:1160px; margin:0 auto; padding:88px 40px 40px;\">\n    <div style=\"position:relative; overflow:hidden; background:#2B2B2B; border-radius:36px; padding:72px 60px; text-align:center;\">\n      <sc-if value=\"{{ showBlobs }}\" hint-placeholder-val=\"{{ true }}\">\n        <svg sc-camel-view-box=\"0 0 172 163\" width=\"220\" style=\"position:absolute; left:-40px; top:-50px; opacity:0.4;\"><path d=\"M 172 87.488 C 172 131.119 121.083 163 82 163 C 42.917 163 0 131.119 0 87.488 C 0 43.858 42.917 0 82 0 C 102.198 0 142.606 6.848 155.5 22 C 167.555 36.166 172 66.406 172 87.488 Z\" fill=\"#D89384\"><\u002Fpath><\u002Fsvg>\n        <svg sc-camel-view-box=\"0 0 160.5 158.48\" width=\"200\" style=\"position:absolute; right:-30px; bottom:-50px; opacity:0.4;\"><path d=\"M 160.5 87.988 C 160.5 108.723 137.569 136.537 124 148.5 C 109.017 161.71 102.381 158 81.871 158 C 42.789 158 0 141.13 0 97.5 C 0 53.87 42.789 0 81.871 0 C 102.07 0 134.338 1.405 147.231 16.557 C 159.286 30.723 160.5 66.906 160.5 87.988 Z\" fill=\"#6EA4B7\"><\u002Fpath><\u002Fsvg>\n      <\u002Fsc-if>\n      <div style=\"position:relative; z-index:1;\">\n        <h2 style=\"font-family:'Baloo 2',sans-serif; font-weight:800; font-size:46px; line-height:1.1; color:#EFEFEF; margin:0 0 18px; text-wrap:balance;\">Leve o CLIC para a sua escola<\u002Fh2>\n        <p style=\"font-size:20px; line-height:1.55; color:#d9d9d9; max-width:600px; margin:0 auto 34px;\">Vamos conversar sobre como integrar a computação ao currículo da sua rede.<\u002Fp>\n        <a href=\"mailto:contato@clic.org.br\" style=\"display:inline-flex; align-items:center; padding:16px 36px; border-radius:44px; background:#C64F28; color:#fff; font-weight:700; font-size:18px;\">Falar com a equipe<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===== FOOTER ===== -->\n  <footer style=\"max-width:1160px; margin:0 auto; padding:72px 40px 56px;\">\n    \n    \n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1160},&quot;showBlobs&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;showApps&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;heroSecondaryCta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      showBlobs: this.props.showBlobs ?? true,\n      showApps: this.props.showApps ?? true,\n      heroSecondaryCta: this.props.heroSecondaryCta ?? true,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<
